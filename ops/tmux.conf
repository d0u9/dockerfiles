# Every login attaches to the one "ops" session (see profile.sh), so a dropped
# browser connection leaves the commands running; logging in again returns
# to them.

# The browser terminal scrolls through tmux only with the mouse turned on.
set -g mouse on
set -g history-limit 50000

# Show in the status line that this is the persistent session.
set -g status-left "[ops] "
set -g status-right "detach: C-b d  scroll: wheel or C-b ["
set -g status-right-length 60
