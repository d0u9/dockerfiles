[global]
    server role = standalone server
    server min protocol = SMB2_10
    server max protocol = SMB3
    map to guest = Never
    restrict anonymous = 2
    disable spoolss = yes
    load printers = no
    printing = bsd
    printcap name = /dev/null
    logging = stdout
    log level = 1

[data]
    path = /shares
    browseable = yes
    read only = no
    guest ok = no
    valid users = @samba-users
    create mask = 0660
    directory mask = 0770
