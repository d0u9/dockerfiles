# Build and push ghcr.io/d0u9/ops when a tag ops/v<version> is
# pushed. Uses only the workflow's own token; no other credential is stored.
name: ops

on:
  push:
    tags: ["ops/v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#ops/v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ops
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ghcr.io/d0u9/ops:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=ops
          cache-to: type=gha,mode=max,scope=ops
