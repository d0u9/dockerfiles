# Build and push ghcr.io/d0u9/samba when a tag samba/v<version> is
# pushed. Uses only the workflow's own token; no other credential is stored.
name: samba

on:
  push:
    tags: ["samba/v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#samba/v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: samba
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/d0u9/samba:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=samba
          cache-to: type=gha,mode=max,scope=samba
