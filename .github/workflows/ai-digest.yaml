# Build and push ghcr.io/d0u9/ai-digest when a tag ai-digest/v<version> is
# pushed. Uses only the workflow's own token; no other credential is stored.
name: ai-digest

on:
  push:
    tags: ["ai-digest/v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#ai-digest/v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ai-digest
          platforms: linux/amd64,linux/arm64
          build-args: AI_DIGEST_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ghcr.io/d0u9/ai-digest:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=ai-digest
          cache-to: type=gha,mode=max,scope=ai-digest
